name: B2-C Offline Scenario Evaluation

on:
  push:
    branches: [work/codex-hoop-hub-b2c-scenario-eval]
    paths: ['ml/coach/**', '.github/workflows/b2c-scenario-eval-ci.yml']
  pull_request:
    paths: ['ml/coach/**', '.github/workflows/b2c-scenario-eval-ci.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-coach:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ml/coach/src
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install test libraries, never model weights
        run: python -m pip install -c ml/coach/b2c-test-constraints.txt -e './ml/coach[dev,service]'
      - name: Focused B2-C tests
        run: python -m pytest ml/coach/scenario_tests -q
      - name: Full Coach and unchanged retrieval regressions
        run: python -m pytest ml/coach/tests ml/coach/retrieval_tests ml/coach/evaluation_tests -q
      - name: Ruff
        run: python -m ruff check ml/coach/src ml/coach/tests ml/coach/scenario_tests ml/coach/retrieval_tests ml/coach/evaluation_tests
      - name: Deterministic regeneration, hashes, leakage
        run: python -m formpath_coach.scenario_cli check --output ml/coach/data/seed-v1
      - name: Reproduce honest held-out baseline, including known failures
        run: |
          python -m formpath_coach.scenario_cli evaluate --output ml/coach/data/seed-v1
          git diff --exit-code -- ml/coach/data/seed-v1
