name: B2-B.1 Coach Retrieval CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"

      - name: Install focused test dependencies
        run: python -m pip install "pytest>=8.4" "pydantic>=2.11" "ruff>=0.12"

      - name: Run B2-B.1 retrieval tests
        env:
          PYTHONPATH: ml/coach/src
        run: python -m pytest ml/coach/retrieval_tests/test_retrieval.py -q

      - name: Ruff retrieval files
        run: python -m ruff check ml/coach/src/formpath_coach/retrieval.py ml/coach/retrieval_tests/test_retrieval.py

  full-coach:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"

      - name: Install Coach with test and service dependencies
        run: python -m pip install -e "./ml/coach[dev,service]"

      - name: Run the full Coach suite plus B2-B.1 retrieval tests
        run: python -m pytest ml/coach/tests ml/coach/retrieval_tests -q

      - name: Ruff the full Coach source and tests
        run: python -m ruff check ml/coach/src ml/coach/tests ml/coach/retrieval_tests
