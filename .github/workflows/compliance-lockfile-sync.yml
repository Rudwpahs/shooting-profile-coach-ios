name: Compliance lockfile sync

on:
  push:
    branches:
      - work/hoophub-release-compliance-v1
    paths:
      - package.json

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/hoophub-release-compliance-v1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          pnpm install --lockfile-only
      - run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sync compliance lockfile"
          git push origin HEAD:work/hoophub-release-compliance-v1
