name: B2-B.2 Retrieval Evaluation CI

on:
  push:
    branches:
      - work/gpt-hoop-hub-b2b2-eval
  pull_request:

permissions:
  contents: read

jobs:
  evaluation:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v6.0.0
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install "pytest>=8.4" "pydantic>=2.11" "ruff>=0.12"

      - name: Run B2-B.2 evaluation tests
        env:
          PYTHONPATH: ml/coach/src
        run: python -m pytest ml/coach/evaluation_tests/test_retrieval_evaluation.py -q

      - name: Ruff evaluation files
        run: python -m ruff check ml/coach/evaluation_tests/test_retrieval_evaluation.py ml/coach/src/formpath_coach/retrieval_eval.py
