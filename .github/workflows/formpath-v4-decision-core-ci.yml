name: FormPath V4 Decision Core CI

on:
  push:
    branches: [work/formpath-v4-decision-core]
    paths:
      - 'ml/coach/**'
      - '.github/workflows/formpath-v4-decision-core-ci.yml'
  pull_request:
    paths:
      - 'ml/coach/**'
      - '.github/workflows/formpath-v4-decision-core-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  decision-core:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ml/coach/src
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install test libraries, never model weights
        run: python -m pip install -c ml/coach/b2c-test-constraints.txt -e './ml/coach[dev,service]'
      - name: Decision Core focused tests
        run: python -m pytest ml/coach/decision_core_tests -q
      - name: Existing Coach and retrieval regressions
        run: python -m pytest ml/coach/tests ml/coach/retrieval_tests ml/coach/evaluation_tests ml/coach/scenario_tests -q
      - name: Ruff
        run: python -m ruff check ml/coach/src ml/coach/tests ml/coach/decision_core_tests ml/coach/retrieval_tests ml/coach/evaluation_tests ml/coach/scenario_tests
      - name: Decision Core smoke training evidence
        run: |
          rm -rf /tmp/formpath-decision-core-smoke
          python -m formpath_coach.decision_core.smoke_training \
            --output-dir /tmp/formpath-decision-core-smoke \
            --source-revision "$GITHUB_SHA"
          cat /tmp/formpath-decision-core-smoke/metrics.json
          cat /tmp/formpath-decision-core-smoke/calibration.json
          cat /tmp/formpath-decision-core-smoke/training_manifest.json
