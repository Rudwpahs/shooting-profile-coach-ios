name: Hoop Hub UI Web Preview

on:
  pull_request:
  push:
    branches:
      - main
      - work/hoophub-film-phase-space-v1
      - work/hoophub-liquid-preview-integration-v1
      - work/hoophub-liquid-dock-v1
      - work/hoophub-unified-web-film-preview-v1
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hoop-hub-ui-pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build install-free UI preview
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_HOOPHUB_UI_PREVIEW_BUILD: "1"
      HOOPHUB_WEB_PREVIEW_BASE_URL: "/shooting-profile-coach-ios"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Activate pnpm 9.12.0 with Corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          test "$(pnpm --version)" = "9.12.0"

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Verify preview and production-isolation contracts
        run: pnpm vitest run tests/ui-web-preview.test.ts tests/ui-demo-isolation.test.ts tests/ui-pages-preview-routing.test.ts tests/ui-demo-interactive-shell.test.ts tests/ui-actual-app-preview.test.ts tests/preview-runtime-isolation.test.ts tests/preview-shooting-profile-source.test.ts tests/preview-capture-controller.test.ts tests/film-space-web-boundary.test.ts tests/film-space-web-frame-extraction.test.ts tests/film-space-web-gl-renderer.test.ts tests/film-space-local-association-web.test.ts tests/liquid-dock.test.ts tests/liquid-screen-rollout.test.ts tests/glass-capabilities.test.ts tests/glass-surface.test.ts tests/liquid-pressable.test.tsx

      - name: Verify ordinary production export excludes demo fixtures and research player evidence
        env:
          EXPO_PUBLIC_HOOPHUB_UI_PREVIEW_BUILD: "0"
          EXPO_PUBLIC_HOOPHUB_UI_DEMO: "0"
          HOOPHUB_WEB_PREVIEW_BASE_URL: ""
        shell: bash
        run: |
          pnpm exec expo export --platform web --output-dir web-production-check
          if grep -R -E "demo-fixture-|demo_fixture_recapture|syntheticLandmarkSession|preview-shot-|preview-user|PreviewRuntimeRoot|PreviewCaptureSession|Stephen Curry|Paul George|IMAGE-LIFTED 3D ANALYSIS|PLAYER_MONOCULAR_3D_ANALYSES" web-production-check; then
            echo "Demo fixture, preview runtime or named-player research content leaked into an ordinary production export" >&2
            exit 1
          fi
          rm -rf web-production-check

      - name: Export production UI preview
        run: pnpm exec expo export --platform web --output-dir web-preview-dist

      - name: Verify static preview output is the real app
        shell: bash
        run: |
          # GitHub Pages serves 404.html for unknown paths; Expo emits the not-found route as +not-found.html.
          cp web-preview-dist/+not-found.html web-preview-dist/404.html
          test -f web-preview-dist/index.html
          test -f web-preview-dist/explore.html
          test -f web-preview-dist/profile.html
          test -f web-preview-dist/reels.html
          test -f web-preview-dist/private-capture.html
          test -f web-preview-dist/private-analysis/preview-shot-001.html
          test -f web-preview-dist/404.html
          if grep -l "Unmatched Route" web-preview-dist/index.html web-preview-dist/private-analysis/preview-shot-001.html; then
            echo "A pre-rendered preview page shows the unmatched-route screen" >&2
            exit 1
          fi
          find web-preview-dist -maxdepth 2 -name "*.html" | sort

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: web-preview-dist

  deploy:
    name: Deploy install-free UI preview
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages-preview
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
