name: Representative 4D CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, lint, test, and export
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          package-manager-cache: false

      - name: Activate pnpm 9.12.0 with Corepack
        shell: bash
        run: |
          corepack enable
          corepack prepare pnpm@9.12.0 --activate
          test "$(pnpm --version)" = "9.12.0"

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Lint
        run: pnpm lint

      - name: Run hermetic unit tests
        run: pnpm test:unit

      - name: Export Expo web bundle
        run: pnpm exec expo export --platform web --output-dir web-dist
