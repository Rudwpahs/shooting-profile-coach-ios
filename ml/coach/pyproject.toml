[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "formpath-coach"
version = "0.1.0"
description = "Experimental PyTorch scaffold for a self-hosted FormPath basketball coaching model"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.13,<2.14",
  "transformers>=4.56",
  "accelerate>=1.10",
  "peft>=0.17",
  # bitsandbytes publishes manylinux x86_64/aarch64 and win_amd64 wheels from 0.47
  # (macOS arm64 wheels only from 0.49). The scaffold's 4-bit path is CUDA-only, so
  # macOS is excluded on purpose; Linux (incl. WSL2) and native Windows are allowed.
  "bitsandbytes>=0.47; platform_system != 'Darwin'",
  "pydantic>=2.11",
  "fastapi>=0.116",
  "uvicorn[standard]>=0.35",
]

[project.optional-dependencies]
service = [
  "firebase-admin>=7,<8",
]
dev = [
  "pytest>=8.4",
  "ruff>=0.12",
  # FastAPI's TestClient is implemented on top of httpx.
  "httpx>=0.28",
  # JSON Schema validation of the exported contract files in the parity gate.
  "jsonschema>=4.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
